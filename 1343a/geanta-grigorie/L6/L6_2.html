<!DOCTYPE html>
<html>
<head>
<title>
Acest titlu va fi modificat cu JS
</title>
</head>
<body>

<p>Salutare, <br /> oameni buni! <br /> (De modificat culoarea de background cu js!)</p>

<p>Folositi metoda <b>getElementsByTagName</b> pentru a modifica culorile indicate in paragrafele alaturate, <br /> precum si titlul paginii !</p>

<p>Acest text va fi colorat <br/>folosind <br /> JavaScript</p>

<script>
// Utilizati getElementsByTagName() si element.style.color/backgroundColor, precum si document.title!
    document.title = "Titlu nou";
    document.getElementsByTagName("p")[0].style.backgroundColor = "red";
    document.getElementsByTagName("p")[2].style.backgroundColor = "blue";
</script>

</body>
</html>
